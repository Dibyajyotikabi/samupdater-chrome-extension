<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SamUpdater Galaxy Update Checker</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://samupdater.com/" target="_blank" rel="noopener noreferrer">SamUpdater</a>
    <a class="quiet-link" href="https://samupdater.com/category/how-to/" target="_blank" rel="noopener noreferrer">
      Galaxy guides
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" aria-hidden="true">
        <path d="M5 4h7v7M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </header>

  <main>
    <section class="checker-panel" aria-labelledby="heading">
      <h1 id="heading">Galaxy update checker</h1>
      <form id="checker">
        <div class="field device-field">
          <label for="device">Device name or model</label>
          <input id="device" list="devices" type="text" placeholder="Galaxy S24 Ultra or SM-S928B"
            maxlength="64" autocomplete="off" spellcheck="false" required>
          <datalist id="devices"></datalist>
        </div>

        <div class="field">
          <label for="region">Country or CSC code</label>
          <input id="region" list="regions" type="text" placeholder="India or INS"
            maxlength="64" autocomplete="off" spellcheck="false" required>
          <datalist id="regions"></datalist>
        </div>
        <button id="check" type="submit">Check update</button>
      </form>

      <p id="status" role="status" aria-atomic="true"></p>

      <section id="release" class="release" aria-labelledby="release-device" hidden>
        <div class="lookup-heading">
          <div>
            <h2 id="release-device"></h2>
            <p id="release-region" class="release-region"></p>
          </div>
          <a id="release-notes" class="quiet-link" target="_blank" rel="noopener noreferrer" hidden>Samsung notes</a>
        </div>
        <dl class="details">
          <div class="build"><dt>Build number</dt><dd id="release-build"></dd></div>
          <div><dt>Release date</dt><dd id="release-date"></dd></div>
          <div><dt>Security patch</dt><dd id="release-patch"></dd></div>
          <div><dt>Software</dt><dd id="release-software"></dd></div>
        </dl>
      </section>
    </section>

    <section class="latest" aria-labelledby="latest-heading">
      <div class="section-heading">
        <h2 id="latest-heading">Latest releases</h2>
        <a class="quiet-link" href="https://samupdater.com/#results" target="_blank" rel="noopener noreferrer">Full tracker</a>
      </div>
      <p id="latest-status" role="status">Loading releases</p>
      <ul id="latest-list" hidden></ul>
      <template id="latest-row">
        <li>
          <a class="latest-row" target="_blank" rel="noopener noreferrer">
            <strong class="latest-device"></strong>
            <time class="latest-date"></time>
            <span class="latest-region"></span>
            <code class="latest-build"></code>
          </a>
        </li>
      </template>
    </section>
  </main>
</body>
</html>
